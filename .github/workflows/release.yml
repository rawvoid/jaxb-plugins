name: 'CD: Publish to Maven Central'

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'
  workflow_dispatch:

jobs:
  release:
    name: Validate and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run Release Validation
        id: validate
        run: |
          echo "::group::Extracting Version"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "POM version: $POM_VERSION"
          echo "Tag name: $TAG_NAME"
          echo "::endgroup::"

          echo "::group::Format Verification"
          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$'

          if [[ ! "$TAG_NAME" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid tag format: $TAG_NAME"
            exit 1
          fi
          echo "✅ Tag format is valid."
          echo "::endgroup::"

          echo "::group::Consistency Check"
          if [[ "$POM_VERSION" != "$TAG_NAME" ]]; then
            echo "::error title=Version Mismatch::POM version ($POM_VERSION) does not match Tag ($TAG_NAME)"
            exit 1
          fi

          if [[ "$POM_VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error::Release version cannot contain -SNAPSHOT"
            exit 1
          fi
          echo "✅ Version consistency verified."
          echo "::endgroup::"

          echo "pom_version=$POM_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Execute Maven Deploy
        run: |
          echo "🚀 Starting deployment of version ${{ github.ref_name }}..."
          mvn clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            plugins/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "### ✅ Release Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ github.ref_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "Tag: **${{ github.ref_name }}**" >> $GITHUB_STEP_SUMMARY
