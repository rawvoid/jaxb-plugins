name: 'CD: Deployment to Maven Central (Release)'

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'

jobs:
  release:
    name: Validate and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run Release Validation
        id: validate
        run: |
          echo "::group::Extracting Version"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "POM version: $POM_VERSION"
          echo "Tag name: $TAG_NAME"
          echo "::endgroup::"

          echo "::group::Format Verification"
          SEMVER_STABLE='^[0-9]+\.[0-9]+\.[0-9]+$'
          SEMVER_PRERELEASE='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$'

          if [[ ! "$TAG_NAME" =~ $SEMVER_STABLE && ! "$TAG_NAME" =~ $SEMVER_PRERELEASE ]]; then
            echo "::error::Invalid tag format: $TAG_NAME"
            exit 1
          fi
          echo "✅ Tag format is valid."
          echo "::endgroup::"

          echo "::group::Consistency Check"
          if [[ "$POM_VERSION" != "$TAG_NAME" ]]; then
            echo "::error title=Version Mismatch::POM version ($POM_VERSION) does not match Tag ($TAG_NAME)"
            exit 1
          fi

          if [[ "$POM_VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error::Release version cannot contain -SNAPSHOT"
            exit 1
          fi
          echo "✅ Version consistency verified."
          echo "::endgroup::"

          echo "pom_version=$POM_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Execute Maven Deploy
        run: |
          echo "🚀 Starting deployment of version ${{ steps.validate.outputs.pom_version }}..."
          mvn clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
