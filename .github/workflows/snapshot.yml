name: 'CI: Publish to Sonatype Snapshot'

on:
  push:
    branches: [ main, master ]

jobs:
  publish:
    name: Build and Deploy Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Extract project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current POM version: $VERSION"

      - name: Validate version type
        id: check-snapshot
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BRANCH_NAME=${GITHUB_REF_NAME}

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "✅ Valid snapshot version ($VERSION) detected on branch: $BRANCH_NAME"
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Non-SNAPSHOT version ($VERSION) detected on branch [$BRANCH_NAME]. Skipping snapshot deployment."
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Sonatype Snapshots
        if: steps.check-snapshot.outputs.is_snapshot == 'true'
        run: |
          echo "🚀 Deploying artifact to Maven Central Snapshot Repository..."
          mvn clean deploy -Dgpg.skip
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Deployment Info
        if: steps.check-snapshot.outputs.is_snapshot == 'false'
        run: |
          echo "### ⏭️ Snapshot Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "The current version **${{ steps.version.outputs.version }}** on branch **${GITHUB_REF_NAME}** is a Release version." >> $GITHUB_STEP_SUMMARY
          echo "Only **-SNAPSHOT** versions are deployed from this workflow; create a release tag to publish a non-snapshot." >> $GITHUB_STEP_SUMMARY
