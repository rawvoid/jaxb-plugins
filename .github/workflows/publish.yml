name: Maven Publish

on:
  push:
    branches: [ main, master ]
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+$'
      - '[0-9]+\.[0-9]+\.[0-9]+-alpha.*$'
      - '[0-9]+\.[0-9]+\.[0-9]+-beta.*$'
      - '[0-9]+\.[0-9]+\.[0-9]+-rc.*$'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME
        server-password: MAVEN_CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_SIGNING_KEY }}
        gpg-passphrase: ${{ secrets.MAVEN_SIGNING_KEY_PASSPHRASE }}

    - name: Extract project version
      id: version
      run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

    - name: Validate version consistency between POM and tag
      id: validate-consistency
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Extract version numbers
        POM_VERSION=${{ steps.version.outputs.version }}
        TAG_NAME=${GITHUB_REF#refs/tags/}

        echo "🔍 Version consistency check"
        echo "📦 POM version: $POM_VERSION"
        echo "🏷️  Tag name: $TAG_NAME"

        # Strict version comparison (POM version must match tag name exactly)
        if [[ "$POM_VERSION" == "$TAG_NAME" ]]; then
          echo "✅ Versions are consistent"
          echo "consistency=valid" >> $GITHUB_OUTPUT
          echo "pom_version=$POM_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        else
          echo "❌ Version mismatch detected!"
          echo ""
          echo "📦 POM version: $POM_VERSION"
          echo "🏷️  Tag name: $TAG_NAME"
          echo ""
          echo "❗️  Release requirements:"
          echo "   • POM version must match tag name exactly"
          echo "   • Both versions must be in semantic version format"
          echo ""
          echo "🔧  To fix:"
          echo "   1. Update POM version to: $TAG_NAME"
          echo "   2. Commit the change"
          echo "   3. Push to main branch"
          echo "   4. Tag again with the same name"
          echo ""
          echo "🚫 Aborting release due to version inconsistency"
          exit 1
        fi

    - name: Show version info
      run: |
        echo "Project version: ${{ steps.version.outputs.version }}"
        echo "Git ref: ${{ github.ref }}"
        echo "Event name: ${{ github.event_name }}"
        if: startsWith(github.ref, 'refs/tags/')
        echo "Tag name: ${{ steps.validate-consistency.outputs.tag_name }}"
        echo "POM version: ${{ steps.validate-consistency.outputs.pom_version }}"
        echo "Consistency: ${{ steps.validate-consistency.outputs.consistency }}"

    - name: Publish SNAPSHOT Version
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
      run: mvn clean deploy
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    - name: Publish RELEASE Version (from tag)
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.validate-consistency.outputs.consistency == 'valid' }}
      run: |
        echo "🚀 Publishing release version: ${{ steps.validate-consistency.outputs.tag_name }}"
        echo "📦 POM version: ${{ steps.validate-consistency.outputs.pom_version }}"
        mvn clean deploy
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

    - name: Skip publish (non-SNAPSHOT on branch)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
      run: |
        echo "Skipping publish: non-SNAPSHOT version on branch push"
        echo "Create a tag to publish release version"
